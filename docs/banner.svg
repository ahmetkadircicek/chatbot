<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgChat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b14"/>
      <stop offset="50%" stop-color="#111328"/>
      <stop offset="100%" stop-color="#0c0e1b"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgChat)"/>
  
  <circle cx="160" cy="120" r="160" fill="#8b5cf6" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1040" cy="300" r="160" fill="#6366f1" fill-opacity="0.10" filter="url(#glow)"/>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(80, 60)">
    <rect width="210" height="30" rx="15" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#a855f7"/>
    <text x="32" y="20" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">CONVERSATIONAL AI</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    Chatbot <tspan fill="url(#aiGrad)">Mobile Assistant</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Smooth conversational interface, streaming dialogue bubbles, and theme adaptation built in Flutter.
  </text>

  <!-- Stack Pills -->
  <g transform="translate(80, 255)">
    <rect width="150" height="38" rx="10" fill="#151730" stroke="#2e2b52" stroke-width="1"/>
    <text x="18" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Flutter · Dart</text>

    <rect x="162" width="165" height="38" rx="10" fill="#151730" stroke="#2e2b52" stroke-width="1"/>
    <text x="182" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Provider Pattern</text>

    <rect x="339" width="165" height="38" rx="10" fill="#151730" stroke="#2e2b52" stroke-width="1"/>
    <text x="359" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Google Fonts</text>

    <rect x="516" width="160" height="38" rx="10" fill="#151730" stroke="#2e2b52" stroke-width="1"/>
    <text x="536" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Vector UI (SVG)</text>
  </g>

  <!-- Visual Card Right Side: Chat Mockup -->
  <g transform="translate(810, 80)">
    <rect width="310" height="260" rx="16" fill="#0c0d1c" stroke="#242345" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">CHAT SESSION</text>
    
    <!-- User Bubble -->
    <g transform="translate(60, 60)">
      <rect width="226" height="42" rx="12" fill="#4f46e5"/>
      <text x="14" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">What are the best places in Istanbul?</text>
    </g>

    <!-- Bot Bubble -->
    <g transform="translate(24, 114)">
      <rect width="262" height="65" rx="12" fill="#1e1e38"/>
      <circle cx="16" cy="18" r="8" fill="#a855f7"/>
      <text x="12" y="22" fill="#ffffff" font-size="10">✦</text>
      <text x="32" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Here are top spots: Hagia Sophia,</text>
      <text x="32" y="42" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Galata Tower &amp; the Bosphorus line!</text>
    </g>

    <!-- Input bar simulation -->
    <g transform="translate(24, 196)">
      <rect width="262" height="42" rx="21" fill="#18182f" stroke="#312e81" stroke-width="1"/>
      <text x="16" y="26" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Ask anything...</text>
      <circle cx="236" cy="21" r="14" fill="#6366f1"/>
      <text x="231" y="26" fill="#ffffff" font-size="14">➔</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      Engineered by <tspan fill="#e2e8f0" font-weight="600">Ahmet Kadir Çiçek</tspan> · github.com/ahmetkadircicek/chatbot
    </text>
  </g>
</svg>
